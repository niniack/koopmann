[project]
name = "koopmann"
version = "0.1.0"
description = ""
authors = [{ name = "Nishant Aswani", email = "nsa325@nyu.edu" }]
requires-python = ">=3.10,<3.13"
readme = "README.md"
dependencies = [
    "torch",
    "torchvision",
    "fire>=0.7.0,<0.8",
    "safetensors>=0.4.5,<0.5",
    "rich>=13.9.3,<14",
    "torchinfo>=1.8.0,<2",
    "pydantic",
    "torcheval>=0.0.7,<0.0.8",
    "pyyaml>=6.0.2,<7",
    "tqdm>=4.66.5,<5",
    "matrepr>=1.0.1,<2",
    "einops>=0.8.0,<0.9",
    "ruff>=0.7.1,<0.8",
    "ipywidgets>=8.1.5,<9",
    "numpy>=1.25,<2",
    "scipy>=1.14.1,<2",
    "scikit-learn>=1.3.0,<2",
    "jupyter-bokeh>=4.0.5,<5",
    "repsim",
    "nbformat>=5.10.4,<6",
    "typer>=0.15.1,<0.16",
    "pyfonts>=0.0.2,<0.0.3",
    "pillow>=11.0.0,<12",
    "imageio[ffmpeg]>=2.36.1,<3",
    "matplotlib>=3.10.0,<4",
    "neural-collapse",
    "wandb>=0.19.6,<0.20",
    "foolbox>=3.3.4,<4",
    "click>=8.1.8,<9",
    "panel>=1.6.2,<2",
    "torchattacks>=3.5.1,<4",
    "hessian-eigenthings",
    "torchviz>=0.0.3,<0.0.4",
    "ipykernel>=6.29.5,<7",
    "deprecated>=1.2.18,<2",
    "plotly==5.24.1",
    "scikit-tda>=1.1.1,<2",
    "giotto-ph>=0.2.4,<0.3",
]

[dependency-groups]
test = [
    "pytest-randomly>=3.15.0,<4",
    "pytest>=8.3.3,<9",
]
dev = [
    "ruff",
    "ipykernel>=6.29.5,<7",
    "matplotlib",
    "seaborn",
]

[tool.uv]
package = true
default-groups = [
    "test",
    "dev"
]
cache-dir = "/mnt/nishant/uv_cache"
link-mode = "symlink"

[[tool.uv.index]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch_cuda"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch_cuda", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch_cuda", marker = "sys_platform == 'linux'" }]
repsim = { git = "https://github.com/wrongu/repsim" }
neural-collapse = { git = "https://github.com/rhubarbwu/neural-collapse.git" }
hessian-eigenthings = { git = "https://github.com/noahgolmant/pytorch-hessian-eigenthings.git", rev = "master" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
# Enable Jupyter Notebook support
line-length = 100 
target-version = "py311"

[tool.ruff.lint]
ignore = ["F722"]
# unfixable = ["F401"] # Unused mports